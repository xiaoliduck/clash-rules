mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
    store-selected: true
    test-url: 'http://1.1.1.1/generate_204'
    test-timeout: 3000
dns:
    enable: true
    ipv6: false
    default-nameserver: [223.5.5.5, 119.29.29.29]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter: ['*.lan', '*.local', '*.localhost', localhost.ptlogin2.qq.com, '+.stun.*.*', '+.stun.*.*.*']
    fake-ip-filter-mode: blacklist
    use-hosts: false
    use-system-hosts: false
    respect-rules: false
    nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
    proxy-server-nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
    nameserver-policy: { 'geosite:cn': ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query'] }
    fallback: ['tls://1.1.1.1', 'tls://8.8.8.8']
    fallback-filter: { geoip: true, geoip-code: CN, geosite: [gfw], ipcidr: [240.0.0.0/4, 0.0.0.0/32, 127.0.0.1/32] }
    direct-nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
    direct-nameserver-follow-policy: true
proxies:
- { name: "🚀直接连接", type: direct }
proxy-groups:
- { name: "🔰国外流量", type: select, proxies: [] }
- { name: "⚓️其他流量", type: select, proxies: ["🔰国外流量", "🚀直接连接"] }
- { name: "✈️Telegram", type: select, proxies: ["🔰国外流量"] }
- { name: "🎬Youtube", type: select, proxies: ["🔰国外流量"] }
- { name: "🎬Netflix", type: select, proxies: ["🔰国外流量"] }
- { name: "🎬哔哩哔哩", type: select, proxies: ["🚀直接连接", "🔰国外流量"] }
- { name: "🎬国外媒体", type: select, proxies: ["🔰国外流量"] }
- { name: "🍎苹果服务", type: select, proxies: ["🚀直接连接"] }
